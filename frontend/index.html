<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalDAV - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container login-container">
    <h1>CalDAV Calendar</h1>
    <p>Connect to your CalDAV server to view and manage events.</p>
    <form id="loginForm">
      <label for="serverUrl">Server URL</label>
      <input type="url" id="serverUrl" placeholder="https://your-worker.workers.dev" required
        value="http://127.0.0.1:8787">

      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Username" required value="admin">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Connect</button>
      <p id="error" class="error"></p>
    </form>
  </div>

  <script src="js/caldav-client.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');

    // Pre-fill from last session
    const saved = sessionStorage.getItem('caldav_config');
    if (saved) {
      try {
        const cfg = JSON.parse(saved);
        if (cfg.serverUrl) document.getElementById('serverUrl').value = cfg.serverUrl;
        if (cfg.username) document.getElementById('username').value = cfg.username;
      } catch(e) {}
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      const serverUrl = document.getElementById('serverUrl').value.replace(/\/+$/, '');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const userPath = `/${username}/`;
        await CalDAVClient.testConnection(serverUrl + userPath, username, password);

        sessionStorage.setItem('caldav_config', JSON.stringify({ serverUrl, username, password }));
        window.location.href = 'calendar.html';
      } catch (err) {
        error.textContent = 'Connection failed: ' + err.message;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });
  </script>
</body>
</html>
