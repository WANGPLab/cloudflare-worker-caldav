<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalDAV Calendar</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>CalDAV Calendar</h1>
      <div class="header-right">
        <button id="refreshBtn" title="Refresh">&#x21bb;</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>

    <div id="calendar"></div>
  </div>

  <!-- Event Edit Modal -->
  <dialog id="eventModal">
    <form id="eventForm">
      <h3 id="modalTitle">New Event</h3>
      <input type="hidden" id="evUid">
      <input type="hidden" id="evEtag">
      <input type="hidden" id="evCalendarPath">

      <label for="evTitle">Title</label>
      <input type="text" id="evTitle" required>

      <label for="evAllDay">
        <input type="checkbox" id="evAllDay" onchange="toggleAllDay()"> All day
      </label>

      <div id="dateTimeFields">
        <label for="evStart">Start</label>
        <input type="datetime-local" id="evStart" required>

        <label for="evEnd">End</label>
        <input type="datetime-local" id="evEnd" required>
      </div>

      <div id="dateFields" style="display:none">
        <label for="evStartDate">Date</label>
        <input type="date" id="evStartDate">

        <label for="evEndDate">End Date</label>
        <input type="date" id="evEndDate">
      </div>

      <label for="evLocation">Location</label>
      <input type="text" id="evLocation">

      <label for="evDesc">Description</label>
      <textarea id="evDesc" rows="3"></textarea>

      <div class="modal-actions">
        <button type="submit" id="evSave">Save</button>
        <button type="button" id="evDelete" class="danger" style="display:none">Delete</button>
        <button type="button" onclick="closeModal()">Cancel</button>
      </div>
      <p id="evError" class="error"></p>
    </form>
  </dialog>

  <script src="js/caldav-client.js"></script>
  <script>
    // Check credentials
    const cfgStr = sessionStorage.getItem('caldav_config');
    if (!cfgStr) { window.location.href = 'index.html'; }
    const cfg = JSON.parse(cfgStr);
    const { serverUrl, username, password } = cfg;
    const userPath = `/${username}/`;
    let currentCalendarPath = null;

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('caldav_config');
      window.location.href = 'index.html';
    });

    // Initialize FullCalendar
    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      height: 'auto',
      selectable: true,
      editable: true,
      eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
      events: async (info, successCallback, failureCallback) => {
        try {
          await loadCalendars();
          const start = info.start.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '') + 'Z';
          const end = info.end.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '') + 'Z';
          const events = await CalDAVClient.fetchEvents(serverUrl, currentCalendarPath, start, end, username, password);
          successCallback(events);
        } catch (e) {
          console.error(e);
          failureCallback(e);
        }
      },
      select: (info) => openNewEvent(info),
      eventClick: (info) => openEditEvent(info.event),
      eventDrop: async (info) => {
        const event = info.event;
        const newEvent = {
          uid: event.extendedProps.uid,
          title: event.title,
          start: event.start.toISOString(),
          end: event.end ? event.end.toISOString() : event.start.toISOString(),
          allDay: event.allDay,
          description: event.extendedProps.description || '',
          location: event.extendedProps.location || '',
        };
        const ics = CalDAVClient.buildICS(newEvent);
        try {
          await CalDAVClient.updateEvent(serverUrl, currentCalendarPath,
            newEvent.uid, ics, event.extendedProps.etag, username, password);
        } catch (e) {
          info.revert();
          console.error(e);
        }
      },
    });
    calendar.render();

    // Load calendars from server
    async function loadCalendars() {
      if (currentCalendarPath) return;
      const calendars = await CalDAVClient.discoverCalendars(serverUrl + userPath, username, password);
      if (calendars.length === 0) throw new Error('No calendars found');
      // Use first calendar (or one named "default")
      const def = calendars.find(c => c.name.toLowerCase().includes('default')) || calendars[0];
      currentCalendarPath = def.href;
      if (!currentCalendarPath.startsWith('/')) currentCalendarPath = '/' + currentCalendarPath;
    }

    // Refresh
    document.getElementById('refreshBtn').addEventListener('click', () => calendar.refetchEvents());

    // Modal functions
    function openNewEvent(info) {
      document.getElementById('modalTitle').textContent = 'New Event';
      document.getElementById('evUid').value = '';
      document.getElementById('evEtag').value = '';
      document.getElementById('evTitle').value = '';
      document.getElementById('evLocation').value = '';
      document.getElementById('evDesc').value = '';
      document.getElementById('evDelete').style.display = 'none';
      document.getElementById('evError').textContent = '';

      const allDay = info.allDay;
      document.getElementById('evAllDay').checked = allDay;
      if (allDay) {
        document.getElementById('evStartDate').value = info.startStr.substring(0, 10);
        document.getElementById('evEndDate').value = info.endStr.substring(0, 10) || info.startStr.substring(0, 10);
      } else {
        document.getElementById('evStart').value = info.startStr.substring(0, 16);
        document.getElementById('evEnd').value = info.endStr.substring(0, 16);
      }
      toggleAllDay();
      document.getElementById('eventModal').showModal();
    }

    function openEditEvent(event) {
      document.getElementById('modalTitle').textContent = 'Edit Event';
      document.getElementById('evUid').value = event.extendedProps.uid || '';
      document.getElementById('evEtag').value = event.extendedProps.etag || '';
      document.getElementById('evTitle').value = event.title || '';
      document.getElementById('evLocation').value = event.extendedProps.location || '';
      document.getElementById('evDesc').value = event.extendedProps.description || '';
      document.getElementById('evDelete').style.display = 'inline-block';
      document.getElementById('evError').textContent = '';

      const allDay = event.allDay;
      document.getElementById('evAllDay').checked = allDay;
      if (allDay) {
        document.getElementById('evStartDate').value = event.startStr.substring(0, 10);
        const endDate = event.end ? new Date(event.end.getTime() - 86400000) : event.start;
        document.getElementById('evEndDate').value = endDate.toISOString().substring(0, 10);
      } else {
        document.getElementById('evStart').value = event.startStr.substring(0, 16);
        document.getElementById('evEnd').value = event.endStr ? event.endStr.substring(0, 16) : event.startStr.substring(0, 16);
      }
      toggleAllDay();
      document.getElementById('eventModal').showModal();
    }

    function closeModal() {
      document.getElementById('eventModal').close();
    }

    function toggleAllDay() {
      const allDay = document.getElementById('evAllDay').checked;
      document.getElementById('dateTimeFields').style.display = allDay ? 'none' : 'block';
      document.getElementById('dateFields').style.display = allDay ? 'block' : 'none';
    }

    // Save event
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const uid = document.getElementById('evUid').value || crypto.randomUUID();
      const etag = document.getElementById('evEtag').value;
      const title = document.getElementById('evTitle').value;
      const location = document.getElementById('evLocation').value;
      const description = document.getElementById('evDesc').value;
      const allDay = document.getElementById('evAllDay').checked;

      let eventData = { uid, title, location, description, allDay };
      if (allDay) {
        eventData.start = document.getElementById('evStartDate').value;
        const endDate = document.getElementById('evEndDate').value;
        if (endDate) {
          const d = new Date(endDate);
          d.setDate(d.getDate() + 1);
          eventData.end = d.toISOString().substring(0, 10);
        }
      } else {
        eventData.start = document.getElementById('evStart').value;
        eventData.end = document.getElementById('evEnd').value;
      }

      const ics = CalDAVClient.buildICS(eventData);
      const errEl = document.getElementById('evError');

      try {
        if (etag) {
          await CalDAVClient.updateEvent(serverUrl, currentCalendarPath, uid, ics, etag, username, password);
        } else {
          await CalDAVClient.createEvent(serverUrl, currentCalendarPath, uid, ics, username, password);
        }
        closeModal();
        calendar.refetchEvents();
      } catch (err) {
        errEl.textContent = 'Error: ' + err.message;
      }
    });

    // Delete event
    document.getElementById('evDelete').addEventListener('click', async () => {
      if (!confirm('Delete this event?')) return;
      const uid = document.getElementById('evUid').value;
      try {
        await CalDAVClient.deleteEvent(serverUrl, currentCalendarPath, uid, username, password);
        closeModal();
        calendar.refetchEvents();
      } catch (err) {
        document.getElementById('evError').textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
